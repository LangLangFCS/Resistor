num\">10<\/div>\n\n  <div class=\"star\" style=\"left:9%;top:5px;animation-delay:-.6s;\"><\/div>\n  <div class=\"star\" style=\"left:18%;top:17px;animation-delay:-2.3s;\"><\/div>\n  <div class=\"star\" style=\"left:27%;top:8px;animation-delay:-3.4s;\"><\/div>\n  <div class=\"star\" style=\"left:36%;top:19px;animation-delay:-1.1s;\"><\/div>\n  <div class=\"star\" style=\"left:45%;top:5px;animation-delay:-4.2s;\"><\/div>\n  <div class=\"star\" style=\"left:52%;top:21px;animation-delay:-2.8s;\"><\/div>\n  <div class=\"star\" style=\"left:66%;top:10px;animation-delay:-.8s;\"><\/div>\n  <div class=\"star\" style=\"left:88%;top:6px;animation-delay:-3.7s;\"><\/div>\n  <div class=\"star\" style=\"left:95%;top:18px;animation-delay:-1.9s;\"><\/div>\n\n  <svg class=\"ball\" width=\"22\" height=\"22\" viewBox=\"0 0 24 24\">\n    <circle cx=\"12\" cy=\"12\" r=\"11\" fill=\"#EDF3FC\"/>\n    <circle cx=\"12\" cy=\"12\" r=\"11\" fill=\"none\" stroke=\"#93AAC6\" stroke-width=\".5\"/>\n    <path d=\"M12 6.2 L15.3 8.6 L14.1 12.6 L9.9 12.6 L8.7 8.6 Z\" fill=\"#1B2433\"/>\n    <path d=\"M12 1.2 L12 6.2 M22.4 8.6 L15.3 8.6 M18.3 22.2 L14.1 12.6 M5.7 22.2 L9.9 12.6 M1.6 8.6 L8.7 8.6\"\n          stroke=\"#1B2433\" stroke-width=\".75\"/>\n    <path d=\"M4.4 4.4 A11 11 0 0 1 12 1.2\" stroke=\"rgba(255,255,255,.65)\" stroke-width=\".8\" fill=\"none\"/>\n  <\/svg>\n\n  <div class=\"line\"><\/div>\n<\/div>\n<\/body>\n<\/html>\n"},{"n":"00 渐变星空","d":"visual","html":"<!DOCTYPE html>\n<html lang=\"zh-CN\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>渐变背景<\/title>\n<style>\n  html, body {\n    margin: 0;\n    padding: 0;\n    width: 100%;\n    height: 100%;\n    overflow: hidden;\n    background: #0B0D0F;\n  }\n  /* 右侧蓝色 → 左侧当前深蓝 */\n  .bg {\n    position: fixed;\n    left: 0;\n    top: 0;\n    width: 100%;\n    height: 100%;\n    background: linear-gradient(to left, #2F6BFF 0%, #1D3F9E 35%, #12224F 65%, #0B0D0F 100%);\n  }\n  /* 星星层 */\n  #stars {\n    position: fixed;\n    left: 0;\n    top: 0;\n    width: 100%;\n    height: 100%;\n    pointer-events: none;\n  }\n  .star {\n    position: absolute;\n    border-radius: 50%;\n    background: #fff;\n    animation: twinkle 3.2s ease-in-out infinite;\n  }\n  @keyframes twinkle {\n    0%, 100% { opacity: .25; }\n    50%      { opacity: .95; }\n  }\n  /* 点击涟漪 */\n  .ripple {\n    position: fixed;\n    pointer-events: none;\n    width: 14px;\n    height: 14px;\n    margin: -7px 0 0 -7px;\n    border-radius: 50%;\n    border: 2px solid rgba(160, 200, 255, .85);\n    box-shadow: 0 0 18px rgba(90, 150, 255, .65), inset 0 0 12px rgba(120, 180, 255, .45);\n    animation: ripple .7s cubic-bezier(.2, .7, .3, 1) forwards;\n  }\n  @keyframes ripple {\n    0%   { opacity: .95; transform: scale(1); }\n    100% { opacity: 0;   transform: scale(16); }\n  }\n<\/style>\n<\/head>\n<body>\n<div class=\"bg\"><\/div>\n<div id=\"stars\"><\/div>\n<script>\n  // 星星：圆点，越靠右越密集\n  (function () {\n    var box = document.getElementById('stars');\n    var n = 110;\n    for (var i = 0; i < n; i++) {\n      var t = Math.pow(Math.random(), 0.45); // 偏右分布\n      var x = t * 100;\n      var y = Math.random() * 100;\n      var d = (1 + Math.random() * 2.2).toFixed(1);\n      var s = document.createElement('div');\n      s.className = 'star';\n      s.style.left = x + '%';\n      s.style.top = y + '%';\n      s.style.width = d + 'px';\n      s.style.height = d + 'px';\n      s.style.animationDelay = (-Math.random() * 3.2) + 's';\n      s.style.animationDuration = (2.4 + Math.random() * 2.4) + 's';\n      box.appendChild(s);\n    }\n  })();\n\n  // 点击涟漪\n  document.addEventListener('mousedown', function (e) {\n    var r = document.createElement('div');\n    r.className = 'ripple';\n    r.style.left = e.clientX + 'px';\n    r.style.top = e.clientY + 'px';\n    document.body.appendChild(r);\n    setTimeout(function () { r.remove(); }, 750);\n  });\n<\/script>\n<\/body>\n<\/html>\n"},{"n":"01 极光","d":"visual","html":"<!DOCTYPE html>\n<html lang=\"zh-CN\">\n<head>\n<meta charset=\"utf-8\">\n<title>01 · 极光<\/title>\n<style>\n  html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#04090A;}\n  .stage{position:fixed;left:0;top:0;width:100%;height:100%;overflow:hidden;}\n  .base{position:absolute;left:0;top:0;width:100%;height:100%;\n        background:linear-gradient(to left,#0C3A34 0%,#0A2A2A 38%,#071418 70%,#04090A 100%);}\n  .band{position:absolute;left:-30%;top:-120%;width:170%;height:340%;}\n  .b1{background:linear-gradient(90deg,rgba(0,0,0,0) 0%,rgba(60,255,200,.55) 22%,rgba(70,200,255,.30) 46%,rgba(0,0,0,0) 70%);\n      animation:sway1 11s ease-in-out infinite alternate;}\n  .b2{background:linear-gradient(90deg,rgba(0,0,0,0) 8%,rgba(150,90,255,.38) 34%,rgba(90,255,190,.30) 58%,rgba(0,0,0,0) 84%);\n      animation:sway2 15s ease-in-out infinite alternate;}\n  .b3{background:linear-gradient(90deg,rgba(0,0,0,0) 18%,rgba(90,220,255,.26) 44%,rgba(0,0,0,0) 68%);\n      opacity:.7;animation:sway3 8s ease-in-out infinite alternate;}\n  @keyframes sway1{0%{transform:translateX(-6%) skewX(-18deg);}100%{transform:translateX(9%) skewX(-26deg);}}\n  @keyframes sway2{0%{transform:translateX(6%) skewX(14deg);}100%{transform:translateX(-7%) skewX(22deg);}}\n  @keyframes sway3{0%{transform:translateX(-3%) skewX(-6deg);}100%{transform:translateX(5%) skewX(-12deg);}}\n  .edge{position:absolute;left:0;top:0;width:100%;height:1px;background:rgba(140,255,230,.30);}\n<\/style>\n<\/head>\n<body>\n<div class=\"stage\">\n  <div class=\"base\"><\/div>\n  <div class=\"band b1\"><\/div>\n  <div class=\"band b2\"><\/div>\n  <div class=\"band b3\"><\/div>\n  <div class=\"edge\"><\/div>\n<\/div>\n<\/body>\n<\/html>\n"},{"n":"02 深空星云","d":"visual","html":"<!DOCTYPE html>\n<html lang=\"zh-CN\">\n<head>\n<meta charset=\"utf-8\">\n<title>02 · 深空星云<\/title>\n<style>\n  html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#070512;}\n  .stage{position:fixed;left:0;top:0;width:100%;height:100%;overflow:hidden;}\n  .base{position:absolute;left:0;top:0;width:100%;height:100%;\n        background:linear-gradient(to left,#3B2E86 0%,#2A2266 34%,#151238 66%,#070512 100%);}\n  .cloud{position:absolute;border-radius:50%;opacity:.55;}\n  .c1{left:40%;top:-160%;width:80%;height:340%;\n      background:radial-gradient(circle,rgba(190,120,255,.55) 0%,rgba(120,80,220,.18) 45%,rgba(0,0,0,0) 72%);\n      animation:breathe 9s ease-in-out infinite alternate;}\n  .c2{left:5%;top:-200%;width:70%;height:420%;\n      background:radial-gradient(circle,rgba(80,160,255,.45) 0%,rgba(60,90,200,.15) 48%,rgba(0,0,0,0) 74%);\n      animation:breathe 13s ease-in-out infinite alternate-reverse;}\n  .c3{left:70%;top:-180%;width:60%;height:380%;\n      background:radial-gradient(circle,rgba(255,120,220,.35) 0%,rgba(160,60,180,.14) 50%,rgba(0,0,0,0) 76%);\n      animation:breathe 17s ease-in-out infinite alternate;}\n  @keyframes breathe{0%{transform:scale(.9) translateX(-3%);}100%{transform:scale(1.15) translateX(4%);}}\n  .dust{position:absolute;left:0;top:0;width:100%;height:100%;\n        background-image:radial-gradient(1px 1px at 12% 30%,rgba(255,255,255,.9),rgba(0,0,0,0)),\n                         radial-gradient(1px 1px at 28% 70%,rgba(220,230,255,.7),rgba(0,0,0,0)),\n                         radial-gradient(1px 1px at 55% 20%,rgba(255,255,255,.8),rgba(0,0,0,0)),\n                         radial-gradient(1px 1px at 72% 66%,rgba(230,220,255,.75),rgba(0,0,0,0)),\n                         radial-gradient(1px 1px at 88% 36%,rgba(255,255,255,.85),rgba(0,0,0,0)),\n                         radial-gradient(1px 1px at 40% 82%,rgba(255,255,255,.6),rgba(0,0,0,0));\n        opacity:.85;animation:twinkle 5s ease-in-out infinite;}\n  @keyframes twinkle{0%,100%{opacity:.45;}50%{opacity:.95;}}\n  .edge{position:absolute;left:0;top:0;width:100%;height:1px;background:rgba(200,180,255,.35);}\n<\/style>\n<\/head>\n<body>\n<div class=\"stage\">\n  <div class=\"base\"><\/div>\n  <div class=\"cloud c1\"><\/div>\n  <div class=\"cloud c2\"><\/div>\n  <div class=\"cloud c3\"><\/div>\n  <div class=\"dust\"><\/div>\n  <div class=\"edge\"><\/div>\n<\/div>\n<\/body>\n<\/html>\n"},{"n":"03 深海","d":"visual","html":"<!DOCTYPE html>\n<html lang=\"zh-CN\">\n<head>\n<meta charset=\"utf-8\">\n<title>03 · 深海<\/title>\n<style>\n  html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#030A12;}\n  .stage{position:fixed;left:0;top:0;width:100%;height:100%;overflow:hidden;}\n  .base{position:absolute;left:0;top:0;width:100%;height:100%;\n        background:linear-gradient(to left,#0A5C86 0%,#084A70 32%,#052B45 66%,#030A12 100%);}\n  .wave{position:absolute;left:-10%;width:120%;height:260%;top:-80%;\n        animation:drift 8s ease-in-out infinite alternate;}\n  .w1{background:linear-gradient(90deg,rgba(0,0,0,0) 0%,rgba(90,220,255,.30) 30%,rgba(0,0,0,0) 60%);}\n  .w2{background:linear-gradient(90deg,rgba(0,0,0,0) 15%,rgba(40,150,230,.35) 45%,rgba(0,0,0,0) 75%);\n      animation-duration:11s;animation-direction:alternate-reverse;}\n  .w3{background:linear-gradient(90deg,rgba(0,0,0,0) 25%,rgba(160,240,255,.22) 55%,rgba(0,0,0,0) 85%);\n      animation-duration:6.5s;}\n  @keyframes drift{0%{transform:translateX(-5%) scaleY(.96);}100%{transform:translateX(6%) scaleY(1.06);}}\n  .bubble{position:absolute;border-radius:50%;background:rgba(190,245,255,.55);\n          animation:rise 7s linear infinite;}\n  @keyframes rise{0%{transform:translateY(120%);opacity:0;}15%{opacity:.85;}85%{opacity:.55;}100%{transform:translateY(-140%);opacity:0;}}\n  .edge{position:absolute;left:0;top:0;width:100%;height:1px;background:rgba(150,230,255,.35);}\n<\/style>\n<\/head>\n<body>\n<div class=\"stage\">\n  <div class=\"base\"><\/div>\n  <div class=\"wave w1\"><\/div>\n  <div class=\"wave w2\"><\/div>\n  <div class=\"wave w3\"><\/div>\n  <div class=\"bubble\" style=\"left:18%;width:3px;height:3px;animation-delay:-1s;\"><\/div>\n  <div class=\"bubble\" style=\"left:36%;width:2px;height:2px;animation-delay:-3.4s;\"><\/div>\n  <div class=\"bubble\" style=\"left:58%;width:4px;height:4px;animation-delay:-5.1s;\"><\/div>\n  <div class=\"bubble\" style=\"left:74%;width:2px;height:2px;animation-delay:-2.2s;\"><\/div>\n  <div class=\"bubble\" style=\"left:88%;width:3px;height:3px;animation-delay:-6.3s;\"><\/div>\n  <div class=\"edge\"><\/div>\n<\/div>\n<\/body>\n<\/html>\n"},{"n":"04 熔岩","d":"visual","html":"<!DOCTYPE html>\n<html lang=\"zh-CN\">\n<head>\n<meta charset=\"utf-8\">\n<title>04 · 熔岩<\/title>\n<style>\n  html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#120503;}\n  .stage{position:fixed;left:0;top:0;width:100%;height:100%;overflow:hidden;}\n  .base{position:absolute;left:0;top:0;width:100%;height:100%;\n        background:linear-gradient(to left,#8A2A08 0%,#5E1B06 34%,#2A0C05 68%,#120503 100%);}\n  .flow{position:absolute;left:-15%;top:-120%;width:130%;height:340%;\n        animation:flow 9s ease-in-out infinite alternate;}\n  .f1{background:linear-gradient(90deg,rgba(0,0,0,0) 0%,rgba(255,140,40,.55) 28%,rgba(255,60,20,.30) 52%,rgba(0,0,0,0) 78%);}\n  .f2{background:linear-gradient(90deg,rgba(0,0,0,0) 12%,rgba(255,90,20,.40) 40%,rgba(255,200,80,.22) 62%,rgba(0,0,0,0) 88%);\n      animation-duration:13s;animation-direction:alternate-reverse;}\n  @keyframes flow{0%{transform:translateX(-4%) skewX(-10deg);}100%{transform:translateX(7%) skewX(12deg);}}\n  .crack{position:absolute;left:0;top:0;width:100%;height:100%;\n         background-image:linear-gradient(90deg,rgba(255,180,90,.35) 0 1px,rgba(0,0,0,0) 1px),\n                          linear-gradient(90deg,rgba(255,220,150,.18) 0 1px,rgba(0,0,0,0) 1px);\n         background-size:180px 100%, 96px 100%;background-position:0 0, 60px 0;\n         opacity:.5;animation:glowpulse 4.5s ease-in-out infinite;}\n  @keyframes glowpulse{0%,100%{opacity:.28;}50%{opacity:.62;}}\n  .edge{position:absolute;left:0;top:0;width:100%;height:1px;background:rgba(255,170,90,.45);}\n<\/style>\n<\/head>\n<body>\n<div class=\"stage\">\n  <div class=\"base\"><\/div>\n  <div class=\"flow f1\"><\/div>\n  <div class=\"flow f2\"><\/div>\n  <div class=\"crack\"><\/div>\n  <div class=\"edge\"><\/div>\n<\/div>\n<\/body>\n<\/html>\n"},{"n":"05 赛博霓虹","d":"visual","html":"<!DOCTYPE html>\n<html lang=\"zh-CN\">\n<head>\n<meta charset=\"utf-8\">\n<title>05 · 赛博霓虹<\/title>\n<style>\n  html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#07020E;}\n  .stage{position:fixed;left:0;top:0;width:100%;height:100%;overflow:hidden;}\n  .base{position:absolute;left:0;top:0;width:100%;height:100%;\n        background:linear-gradient(to left,#6A1D9E 0%,#3B1166 34%,#1A0A33 68%,#07020E 100%);}\n  .grid{position:absolute;left:0;top:0;width:100%;height:100%;\n        background-image:linear-gradient(90deg,rgba(0,240,255,.28) 0 1px,rgba(0,0,0,0) 1px),\n                         linear-gradient(90deg,rgba(255,40,200,.16) 0 1px,rgba(0,0,0,0) 1px);\n        background-size:64px 100%, 16px 100%;\n        opacity:.6;animation:slide 6s linear infinite;}\n  @keyframes slide{0%{background-position:0 0,0 0;}100%{background-position:64px 0,16px 0;}}\n  .scan{position:absolute;left:-30%;top:0;width:30%;height:100%;\n        background:linear-gradient(90deg,rgba(0,0,0,0),rgba(0,255,255,.35),rgba(255,0,200,.25),rgba(0,0,0,0));\n        animation:scan 5.5s linear infinite;}\n  @keyframes scan{0%{left:-30%;}100%{left:105%;}}\n  .edge{position:absolute;left:0;top:0;width:100%;height:1px;background:rgba(0,240,255,.55);}\n  .edge2{position:absolute;left:0;bottom:0;width:100%;height:1px;background:rgba(255,40,200,.45);}\n<\/style>\n<\/head>\n<body>\n<div class=\"stage\">\n  <div class=\"base\"><\/div>\n  <div class=\"grid\"><\/div>\n  <div class=\"scan\"><\/div>\n  <div class=\"edge\"><\/div>\n  <div class=\"edge2\"><\/div>\n<\/div>\n<\/body>\n<\/html>\n"},{"n":"06 矩阵","d":"visual","html":"<!DOCTYPE html>\n<html lang=\"zh-CN\">\n<head>\n<meta charset=\"utf-8\">\n<title>06 · 矩阵<\/title>\n<style>\n  html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#01060A;}\n  .stage{position:fixed;left:0;top:0;width:100%;height:100%;overflow:hidden;}\n  .base{position:absolute;left:0;top:0;width:100%;height:100%;\n        background:linear-gradient(to left,#07351B 0%,#05281A 34%,#031510 68%,#01060A 100%);}\n  canvas{position:absolute;left:0;top:0;width:100%;height:100%;opacity:.85;}\n  .edge{position:absolute;left:0;top:0;width:100%;height:1px;background:rgba(80,255,150,.40);}\n<\/style>\n<\/head>\n<body>\n<div class=\"stage\">\n  <div class=\"base\"><\/div>\n  <canvas id=\"cv\"><\/canvas>\n  <div class=\"edge\"><\/div>\n<\/div>\n<script>\n  (function () {\n    var cv = document.getElementById('cv');\n    var ctx = cv.getContext('2d');\n    var chars = '01ABCDEF<>[]{}$#%&*+=';\n    var cols = [], w = 0, h = 0, fs = 12, dpr = window.devicePixelRatio || 1;\n\n    function resize() {\n      w = cv.width = Math.max(1, Math.floor(cv.clientWidth * dpr));\n      h = cv.height = Math.max(1, Math.floor(cv.clientHeight * dpr));\n      var n = Math.floor(w / (fs * dpr));\n      cols = [];\n      for (var i = 0; i < n; i++) cols.push(Math.random() * h);\n    }\n    resize();\n    window.onresize = resize;\n\n    function draw() {\n      ctx.fillStyle = 'rgba(1,6,10,0.28)';\n      ctx.fillRect(0, 0, w, h);\n      ctx.font = (fs * dpr) + 'px Consolas, monospace';\n      for (var i = 0; i < cols.length; i++) {\n        var x = i * fs * dpr;\n        var y = cols[i];\n        var ch = chars.charAt(Math.floor(Math.random() * chars.length));\n        ctx.fillStyle = 'rgba(120,255,170,0.95)';\n        ctx.fillText(ch, x, y);\n        ctx.fillStyle = 'rgba(40,200,110,0.55)';\n        ctx.fillText(chars.charAt(Math.floor(Math.random() * chars.length)), x, y - fs * dpr);\n        cols[i] = y > h + Math.random() * 400 ? -fs * dpr : y + fs * dpr;\n      }\n      setTimeout(draw, 70);\n    }\n    draw();\n  })();\n<\/script>\n<\/body>\n<\/html>\n"},{"n":"07 极简黑","d":"visual","html":"<!DOCTYPE html>\n<html lang=\"zh-CN\">\n<head>\n<meta charset=\"utf-8\">\n<title>07 · 极简黑<\/title>\n<style>\n  html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#0B0D0F;}\n  .stage{position:fixed;left:0;top:0;width:100%;height:100%;overflow:hidden;}\n  .base{position:absolute;left:0;top:0;width:100%;height:100%;\n        background:linear-gradient(to left,#1A1D22 0%,#141720 40%,#0E1014 72%,#0B0D0F 100%);}\n  .sheen{position:absolute;left:-40%;top:-60%;width:45%;height:220%;\n         background:linear-gradient(100deg,rgba(255,255,255,0),rgba(255,255,255,.10),rgba(255,255,255,0));\n         animation:sheen 7s ease-in-out infinite;}\n  @keyframes sheen{0%{left:-45%;}55%,100%{left:110%;}}\n  .dotline{position:absolute;left:0;top:50%;width:100%;height:1px;\n           background:linear-gradient(90deg,rgba(255,255,255,.16),rgba(255,255,255,.03) 60%,rgba(255,255,255,0));}\n  .edge{position:absolute;left:0;top:0;width:100%;height:1px;background:rgba(255,255,255,.10);}\n<\/style>\n<\/head>\n<body>\n<div class=\"stage\">\n  <div class=\"base\"><\/div>\n  <div class=\"dotline\"><\/div>\n  <div class=\"sheen\"><\/div>\n  <div class=\"edge\"><\/div>\n<\/div>\n<\/body>\n<\/html>\n"},{"n":"08 金属拉丝","d":"visual","html":"<!DOCTYPE html>\n<html lang=\"zh-CN\">\n<head>\n<meta charset=\"utf-8\">\n<title>08 · 金属拉丝<\/title>\n<style>\n  html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#0D1014;}\n  .stage{position:fixed;left:0;top:0;width:100%;height:100%;overflow:hidden;}\n  .base{position:absolute;left:0;top:0;width:100%;height:100%;\n        background:linear-gradient(to left,#9AA6B4 0%,#6E7A88 26%,#3E4854 62%,#141A20 100%);}\n  .brush{position:absolute;left:0;top:0;width:100%;height:100%;\n         background-image:repeating-linear-gradient(90deg,rgba(255,255,255,.10) 0 1px,rgba(0,0,0,.10) 1px 2px,rgba(0,0,0,0) 2px 5px);\n  class=\"stage\">\n  <div class=\"base\"><\/div>\n  <div class=\"mist\"><\/div>\n  <div class=\"flake\" style=\"left:6%;width:3px;height:3px;animation-duration:9s;animation-delay:-1s;\"><\/div>\n  <div class=\"flake\" style=\"left:18%;width:2px;height:2px;animation-duration:12s;animation-delay:-5s;\"><\/div>\n  <div class=\"flake\" style=\"left:30%;width:4px;height:4px;animation-duration:10s;animation-delay:-2.5s;\"><\/div>\n  <div class=\"flake\" style=\"left:44%;width:2px;height:2px;animation-duration:14s;animation-delay:-7s;\"><\/div>\n  <div class=\"flake\" style=\"left:57%;width:3px;height:3px;animation-duration:11s;animation-delay:-4s;\"><\/div>\n  <div class=\"flake\" style=\"left:69%;width:2px;height:2px;animation-duration:13s;animation-delay:-6s;\"><\/div>\n  <div class=\"flake\" style=\"left:80%;width:4px;height:4px;animation-duration:9.5s;animation-delay:-3s;\"><\/div>\n  <div class=\"flake\" style=\"left:92%;width:3px;height:3px;animation-duration:12.5s;animation-delay:-8s;\"><\/div>\n  <div class=\"edge\"><\/div>\n<\/div>\n<\/body>\n<\/html>\n"},{"n":"13 细雨","d":"visual","html":"<!DOCTYPE html>\n<html lang=\"zh-CN\">\n<head>\n<meta charset=\"utf-8\">\n<title>13 · 细雨<\/title>\n<style>\n  html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#070B10;}\n  .stage{position:fixed;left:0;top:0;width:100%;height:100%;overflow:hidden;}\n  .base{position:absolute;left:0;top:0;width:100%;height:100%;\n        background:linear-gradient(to left,#16324A 0%,#102338 38%,#0A1420 70%,#070B10 100%);}\n  .mist{position:absolute;left:-20%;top:0;width:140%;height:100%;opacity:.55;\n        background:linear-gradient(90deg,rgba(0,0,0,0) 0%,rgba(120,190,255,.10) 30%,rgba(160,220,255,.16) 55%,rgba(0,0,0,0) 85%);\n        animation:drift 14s ease-in-out infinite alternate;}\n  @keyframes drift{0%{transform:translateX(-8%);}100%{transform:translateX(8%);}}\n  .rain{position:absolute;left:0;top:0;width:100%;height:100%;}\n  .drop{position:absolute;width:1px;height:14px;border-radius:1px;\n        background:linear-gradient(180deg,rgba(180,225,255,0) 0%,rgba(180,225,255,.85) 100%);\n        animation:fall 1.1s linear infinite;}\n  @keyframes fall{0%{transform:translateY(-40px);opacity:0;}\n                  10%{opacity:.9;}\n                  100%{transform:translateY(220px);opacity:0;}}\n  .edge{position:absolute;left:0;top:0;width:100%;height:1px;background:rgba(150,210,255,.32);}\n<\/style>\n<\/head>\n<body>\n<div class=\"stage\">\n  <div class=\"base\"><\/div>\n  <div class=\"mist\"><\/div>\n  <div class=\"rain\" id=\"rain\"><\/div>\n  <div class=\"edge\"><\/div>\n<\/div>\n<script>\n  (function () {\n    var box = document.getElementById('rain');\n    for (var i = 0; i < 70; i++) {\n      var d = document.createElement('div');\n      d.className = 'drop';\n      d.style.left = (Math.random() * 100) + '%';\n      d.style.top = (-Math.random() * 200) + 'px';\n      d.style.height = (8 + Math.random() * 14) + 'px';\n      d.style.opacity = 0.25 + Math.random() * 0.6;\n      d.style.animationDelay = (-Math.random() * 1.1) + 's';\n      d.style.animationDuration = (0.9 + Math.random() * 0.8) + 's';\n      box.appendChild(d);\n    }\n  })();\n<\/script>\n<\/body>\n<\/html>\n"},{"n":"14 流光线","d":"visual","html":"<!DOCTYPE html>\n<html lang=\"zh-CN\">\n<head>\n<meta charset=\"utf-8\">\n<title>14 · 流光线<\/title>\n<style>\n  html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#080A10;}\n  .stage{position:fixed;left:0;top:0;width:100%;height:100%;overflow:hidden;}\n  .base{position:absolute;left:0;top:0;width:100%;height:100%;\n        background:linear-gradient(to left,#123055 0%,#132846 38%,#0C1524 70%,#080A10 100%);}\n  .beam{position:absolute;left:0;width:100%;height:1px;\n        background:linear-gradient(90deg,rgba(0,0,0,0) 0%,rgba(120,200,255,.9) 45%,rgba(190,235,255,1) 52%,rgba(120,200,255,.9) 59%,rgba(0,0,0,0) 100%);\n        animation:slide 5.5s linear infinite;}\n  @keyframes slide{0%{transform:translateX(-55%);opacity:0;}\n                   12%{opacity:1;}\n                   88%{opacity:1;}\n                   100%{transform:translateX(55%);opacity:0;}}\n  .glowline{position:absolute;left:0;width:100%;height:100%;opacity:.35;\n        background:linear-gradient(90deg,rgba(0,0,0,0) 30%,rgba(90,170,255,.22) 50%,rgba(0,0,0,0) 70%);\n        animation:slide2 9s linear infinite;}\n  @keyframes slide2{0%{transform:translateX(-40%);}100%{transform:translateX(40%);}}\n  .edge{position:absolute;left:0;top:0;width:100%;height:1px;background:rgba(150,210,255,.35);}\n  .edgeb{position:absolute;left:0;bottom:0;width:100%;height:1px;background:rgba(90,150,220,.18);}\n<\/style>\n<\/head>\n<body>\n<div class=\"stage\">\n  <div class=\"base\"><\/div>\n  <div class=\"glowline\"><\/div>\n  <div class=\"beam\" style=\"top:6px;animation-delay:-1.2s;\"><\/div>\n  <div class=\"beam\" style=\"top:14px;animation-delay:-3.4s;opacity:.7;height:1px;\"><\/div>\n  <div class=\"beam\" style=\"top:23px;animation-delay:-2.1s;opacity:.55;\"><\/div>\n  <div class=\"edge\"><\/div>\n  <div class=\"edgeb\"><\/div>\n<\/div>\n<\/body>\n<\/html>\n"},{"n":"15 波纹","d":"visual","html":"<!DOCTYPE html>\n<html lang=\"zh-CN\">\n<head>\n<meta charset=\"utf-8\">\n<title>15 · 波纹<\/title>\n<style>\n  html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#08121A;}\n  .stage{position:fixed;left:0;top:0;width:100%;height:100%;overflow:hidden;}\n  .base{position:absolute;left:0;top:0;width:100%;height:100%;\n        background:linear-gradient(to left,#0E3A4A 0%,#0B2A38 38%,#071820 70%,#08121A 100%);}\n  .wire{position:absolute;left:0;width:100%;height:100%;\n        background:radial-gradient(60% 260% at 88% 50%,rgba(120,235,255,.20) 0%,rgba(120,235,255,0) 60%);}\n  .rip{position:absolute;border-radius:50%;border:1px solid rgba(140,240,255,.55);\n       animation:expand 4.5s ease-out infinite;}\n  @keyframes expand{0%{transform:scale(.15);opacity:0;}\n                    10%{opacity:.85;}\n                    100%{transform:scale(2.6);opacity:0;}}\n  .edge{position:absolute;left:0;top:0;width:100%;height:1px;background:rgba(140,240,255,.30);}\n<\/style>\n<\/head>\n<body>\n<div class=\"stage\">\n  <div class=\"base\"><\/div>\n  <div class=\"wire\"><\/div>\n  <div class=\"rip\" style=\"left:76%;top:50%;width:220px;height:220px;margin:-110px 0 0 -110px;animation-delay:0s;\"><\/div>\n  <div class=\"rip\" style=\"left:76%;top:50%;width:220px;height:220px;margin:-110px 0 0 -110px;animation-delay:-1.5s;\"><\/div>\n  <div class=\"rip\" style=\"left:76%;top:50%;width:220px;height:220px;margin:-110px 0 0 -110px;animation-delay:-3s;\"><\/div>\n  <div class=\"rip\" style=\"left:38%;top:50%;width:160px;height:160px;margin:-80px 0 0 -80px;animation-delay:-2.2s;border-color:rgba(120,200,255,.35);\"><\/div>\n  <div class=\"edge\"><\/div>\n<\/div>\n<\/body>\n<\/html>\n"},{"n":"16 电路","d":"visual","html":"<!DOCTYPE html>\n<html lang=\"zh-CN\">\n<head>\n<meta charset=\"utf-8\">\n<title>16 · 电路<\/title>\n<style>\n  html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#06100E;}\n  .stage{position:fixed;left:0;top:0;width:100%;height:100%;overflow:hidden;}\n  .base{position:absolute;left:0;top:0;width:100%;height:100%;\n        background:linear-gradient(to left,#0B3A31 0%,#0A2A26 38%,#071713 70%,#06100E 100%);}\n  /* 网格线路：横向 */\n  .htrace{position:absolute;left:0;width:100%;height:1px;background:rgba(80,230,180,.20);}\n  /* 纵向短接线 */\n  .vtrace{position:absolute;width:1px;height:100%;background:rgba(80,230,180,.16);}\n  .node{position:absolute;width:5px;height:5px;border-radius:50%;background:rgba(120,255,210,.75);\n        box-shadow:0 0 6px rgba(90,255,200,.7);animation:pulse 2.4s ease-in-out infinite;}\n  @keyframes pulse{0%,100%{opacity:.25;}50%{opacity:1;}}\n  .flow{position:absolute;left:0;width:100%;height:2px;\n        background:linear-gradient(90deg,rgba(0,0,0,0) 0%,rgba(120,255,210,.85) 50%,rgba(0,0,0,0) 100%);\n        animation:run 4s linear infinite;}\n  @keyframes run{0%{transform:translateX(-60%);opacity:0;}\n                 15%{opacity:1;}85%{opacity:1;}\n                 100%{transform:translateX(60%);opacity:0;}}\n  .edge{position:absolute;left:0;top:0;width:100%;height:1px;background:rgba(120,255,210,.30);}\n<\/style>\n<\/head>\n<body>\n<div class=\"stage\">\n  <div class=\"base\"><\/div>\n  <div class=\"htrace\" style=\"top:5px;\"><\/div>\n  <div class=\"htrace\" style=\"top:11px;\"><\/div>\n  <div class=\"htrace\" style=\"top:19px;\"><\/div>\n  <div class=\"htrace\" style=\"top:26px;\"><\/div>\n  <div class=\"vtrace\" style=\"left:12%;\"><\/div>\n  <div class=\"vtrace\" style=\"left:33%;\"><\/div>\n  <div class=\"vtrace\" style=\"left:58%;\"><\/div>\n  <div class=\"vtrace\" style=\"left:81%;\"><\/div>\n  <div class=\"vtrace\" style=\"left:94%;\"><\/div>\n  <div class=\"node\" style=\"left:12%;top:11px;\"><\/div>\n  <div class=\"node\" style=\"left:33%;top:19px;animation-delay:-.8s;\"><\/div>\n  <div class=\"node\" style=\"left:58%;top:5px;animation-delay:-1.6s;\"><\/div>\n  <div class=\"node\" style=\"left:81%;top:26px;animation-delay:-.4s;\"><\/div>\n  <div class=\"node\" style=\"left:94%;top:11px;animation-delay:-1.9s;\"><\/div>\n  <div class=\"flow\" style=\"top:11px;animation-delay:-.6s;\"><\/div>\n  <div class=\"flow\" style=\"top:26px;animation-delay:-2.4s;opacity:.6;\"><\/div>\n  <div class=\"edge\"><\/div>\n<\/div>\n<\/body>\n<\/html>\n"},{"n":"17 粒子","d":"visual","html":"<!DOCTYPE html>\n<html lang=\"zh-CN\">\n<head>\n<meta charset=\"utf-8\">\n<title>17 · 粒子<\/title>\n<style>\n  html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#080A12;}\n  .stage{position:fixed;left:0;top:0;width:100%;height:100%;overflow:hidden;}\n  .base{position:absolute;left:0;top:0;width:100%;height:100%;\n        background:linear-gradient(to left,#2A2F6B 0%,#1B1F4A 38%,#0E1128 70%,#080A12 100%);}\n  .halo{position:absolute;left:0;top:0;width:100%;height:100%;\n        background:radial-gradient(50% 200% at 85% 50%,rgba(150,170,255,.22) 0%,rgba(150,170,255,0) 65%);}\n  canvas{position:absolute;left:0;top:0;width:100%;height:100%;display:block;}\n  .edge{position:absolute;left:0;top:0;width:100%;height:1px;background:rgba(170,190,255,.32);}\n<\/style>\n<\/head>\n<body>\n<div class=\"stage\">\n  <div class=\"base\"><\/div>\n  <div class=\"halo\"><\/div>\n  <canvas id=\"cv\"><\/canvas>\n  <div class=\"edge\"><\/div>\n<\/div>\n<script>\n  (function () {\n    var cv = document.getElementById('cv');\n    var ctx = cv.getContext('2d');\n    var W = 0, H = 0, parts = [];\n    function resize() {\n      W = cv.width = cv.offsetWidth || 800;\n      H = cv.height = cv.offsetHeight || 30;\n      build();\n    }\n    function build() {\n      parts = [];\n      var n = Math.max(24, Math.min(90, Math.floor(W / 16)));\n      for (var i = 0; i < n; i++) {\n        parts.push({\n          x: Math.random() * W,\n          y: Math.random() * H,\n          r: 0.6 + Math.random() * 1.6,\n          vx: 0.15 + Math.random() * 0.35,\n          vy: (Math.random() - 0.5) * 0.18,\n          a: 0.25 + Math.random() * 0.6,\n          ph: Math.random() * 6.28\n        });\n      }\n    }\n    function tick(t) {\n      ctx.clearRect(0, 0, W, H);\n      for (var i = 0; i < parts.length; i++) {\n        var p = parts[i];\n        p.x += p.vx;\n        p.y += p.vy;\n        if (p.x > W + 6) { p.x = -6; p.y = Math.random() * H; }\n        if (p.y < -6) p.y = H + 6;\n        if (p.y > H + 6) p.y = -6;\n        var tw = 0.55 + 0.45 * Math.sin(t * 0.0016 + p.ph);\n        ctx.beginPath();\n        ctx.arc(p.x, p.y, p.r, 0, 6.2832);\n        ctx.fillStyle = 'rgba(190,205,255,' + (p.a * tw).toFixed(2) + ')';\n        ctx.fill();\n      }\n      requestAnimationFrame(tick);\n    }\n    if (window.addEventListener) window.addEventListener('resize', resize, false);\n    resize();\n    requestAnimationFrame(tick);\n  })();\n<\/script>\n<\/body>\n<\/html>\n"},{"n":"18 彩带","d":"visual","html":"<!DOCTYPE html>\n<html lang=\"zh-CN\">\n<head>\n<meta charset=\"utf-8\">\n<title>18 · 彩带<\/title>\n<style>\n  html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#0D0912;}\n  .stage{position:fixed;left:0;top:0;width:100%;height:100%;overflow:hidden;}\n  .base{position:absolute;left:0;top:0;width:100%;height:100%;\n        background:linear-gradient(to left,#4A1F3A 0%,#33162C 38%,#1A0D1A 70%,#0D0912 100%);}\n  .ribbon{position:absolute;left:-40%;width:180%;height:8px;border-radius:8px;\n          opacity:.55;animation:sway 7s ease-in-out infinite alternate;}\n  .r1{top:4px;background:linear-gradient(90deg,rgba(255,90,170,0) 0%,rgba(255,90,170,.85) 30%,rgba(255,180,90,.85) 55%,rgba(255,90,170,0) 85%);}\n  .r2{top:13px;background:linear-gradient(90deg,rgba(120,140,255,0) 0%,rgba(120,140,255,.8) 26%,rgba(90,240,220,.8) 56%,rgba(120,140,255,0) 88%);\n      animation-duration:9s;animation-delay:-2s;height:6px;}\n  .r3{top:22px;background:linear-gradient(90deg,rgba(255,210,90,0) 0%,rgba(255,210,90,.7) 34%,rgba(255,120,160,.7) 62%,rgba(255,210,90,0) 90%);\n      animation-duration:11s;animation-delay:-4s;height:5px;}\n  @keyframes sway{0%{transform:translateX(-5%) skewX(-8deg);}\n                  100%{transform:translateX(6%) skewX(8deg);}}\n  .shine{position:absolute;left:0;top:0;width:100%;height:100%;\n         background:linear-gradient(90deg,rgba(0,0,0,0) 40%,rgba(255,255,255,.10) 50%,rgba(0,0,0,0) 60%);\n         animation:shine 6s linear infinite;}\n  @keyframes shine{0%{transform:translateX(-50%);}100%{transform:translateX(50%);}}\n  .edge{position:absolute;left:0;top:0;width:100%;height:1px;background:rgba(255,140,200,.35);}\n<\/style>\n<\/head>\n<body>\n<div class=\"stage\">\n  <div class=\"base\"><\/div>\n  <div class=\"shine\"><\/div>\n  <div class=\"ribbon r1\"><\/div>\n  <div class=\"ribbon r2\"><\/div>\n  <div class=\"ribbon r3\"><\/div>\n  <div class=\"edge\"><\/div>\n<\/div>\n<\/body>\n<\/html>\n"},{"n":"19 玻璃","d":"visual","html":"<!DOCTYPE html>\n<html lang=\"zh-CN\">\n<head>\n<meta charset=\"utf-8\">\n<title>19 · 玻璃<\/title>\n<style>\n  html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#0A1016;}\n  .stage{position:fixed;left:0;top:0;width:100%;height:100%;overflow:hidden;}\n  /* 底层：偏冷的深色，模拟玻璃后景 */\n  .base{position:absolute;left:0;top:0;width:100%;height:100%;\n        background:linear-gradient(to left,#2C4B63 0%,#21384C 36%,#141F2B 68%,#0A1016 100%);}\n  /* 玻璃高光：斜向扫过 */\n  .sheen{position:absolute;left:-60%;top:-100%;width:220%;height:320%;\n         background:linear-gradient(105deg,rgba(255,255,255,0) 38%,rgba(220,240,255,.16) 47%,rgba(255,255,255,.28) 50%,rgba(220,240,255,.14) 53%,rgba(255,255,255,0) 62%);\n         animation:sheen 9s ease-in-out infinite;}\n  @keyframes sheen{0%{transform:translateX(-18%);}50%{transform:translateX(10%);}100%{transform:translateX(-18%);}}\n  /* 玻璃分层反光条 */\n  .slab{position:absolute;left:0;width:100%;height:1px;background:rgba(210,235,255,.14);}\n  /* 边缘玻璃厚度感 */\n  .rim{position:absolute;left:0;top:0;width:100%;height:2px;\n       background:linear-gradient(90deg,rgba(255,255,255,.10) 0%,rgba(255,255,255,.45) 45%,rgba(255,255,255,.18) 75%,rgba(255,255,255,.30) 100%);}\n  .rimb{position:absolute;left:0;bottom:0;width:100%;height:1px;background:rgba(140,180,210,.22);}\n  /* 顶部柔光 */\n  .soft{position:absolute;left:0;top:0;width:100%;height:100%;\n        background:radial-gradient(70% 240% at 92% 50%,rgba(180,225,255,.24) 0%,rgba(180,225,255,0) 62%);}\n<\/style>\n<\/head>\n<body>\n<div class=\"stage\">\n  <div class=\"base\"><\/div>\n  <div class=\"soft\"><\/div>\n  <div class=\"sheen\"><\/div>\n  <div class=\"slab\" style=\"top:6px;\"><\/div>\n  <div class=\"slab\" style=\"top:14px;opacity:.6;\"><\/div>\n  <div class=\"slab\" style=\"top:22px;opacity:.35;\"><\/div>\n  <div class=\"rim\"><\/div>\n  <div class=\"rimb\"><\/div>\n<\/div>\n<\/body>\n<\/html>\n"},{"n":"20 流星","d":"visual","html":"<! nimation-delay:-.9s;\"><\/div>\n  <div class=\"twinkle\" style=\"left:52%;top:4px;animation-delay:-1.7s;\"><\/div>\n  <div class=\"twinkle\" style=\"left:67%;top:23px;animation-delay:-2.3s;\"><\/div>\n  <div class=\"twinkle\" style=\"left:79%;top:11px;animation-delay:-.5s;\"><\/div>\n  <div class=\"twinkle\" style=\"left:91%;top:7px;animation-delay:-1.2s;\"><\/div>\n  <div class=\"twinkle\" style=\"left:96%;top:21px;animation-delay:-2.8s;\"><\/div>\n\n  <div class=\"edge\"><\/div>\n<\/div>\n<\/body>\n<\/html>\n"},{"n":"21 极光·深蓝","d":"visual","html":"<!DOCTYPE html>\n<html lang=\"zh-CN\">\n<head>\n<meta charset=\"utf-8\">\n<title>21 极光·深蓝<\/title>\n<style>\n  html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#0B0D0F;}\n  .stage{position:fixed;left:0;top:0;width:100%;height:100%;overflow:hidden;}\n  .base{position:absolute;left:0;top:0;width:100%;height:100%;\n        background:linear-gradient(to left,#2F6BFF 0%,#1D3F9E 38%,#12224F 70%,#0B0D0F 100%);}\n  .edge{position:absolute;left:0;top:0;width:100%;height:1px;background:rgba(150,195,255,.30);}\n\n  .band{position:absolute;left:-30%;top:-120%;width:170%;height:340%;}\n  .b1{background:linear-gradient(90deg,rgba(0,0,0,0) 0%,rgba(150,195,255,.55) 22%,rgba(90,150,255,.30) 46%,rgba(0,0,0,0) 70%);animation:sw1 11s ease-in-out infinite alternate;}\n  .b2{background:linear-gradient(90deg,rgba(0,0,0,0) 8%,rgba(90,150,255,.38) 34%,rgba(150,195,255,.30) 58%,rgba(0,0,0,0) 84%);animation:sw2 15s ease-in-out infinite alternate;}\n  .b3{background:linear-gradient(90deg,rgba(0,0,0,0) 18%,rgba(150,195,255,.26) 44%,rgba(0,0,0,0) 68%);opacity:.7;animation:sw3 8s ease-in-out infinite alternate;}\n  @keyframes sw1{0%{transform:translateX(-6%) skewX(-18deg);}100%{transform:translateX(9%) skewX(-26deg);}}\n  @keyframes sw2{0%{transform:translateX(6%) skewX(14deg);}100%{transform:translateX(-7%) skewX(22deg);}}\n  @keyframes sw3{0%{transform:translateX(-3%) skewX(-6deg);}100%{transform:translateX(5%) skewX(-1 <script>
(function () {
  'use strict';
  var S = JSON.parse(document.getElementById('skinData').textContent || '[]');
  var BY = {}, POOL = { visual: [], color: [] };
  function dispName(n) { return n.replace(/^\d+\s*/, ''); }
  function idxOf(n) { var m = /^(\d+)/.exec(n); return m ? parseInt(m[1], 10) : 9999; }
  var i, it;
  for (i = 0; i < S.length; i++) {
    it = S[i];
    it.disp = dispName(it.n);
    it.key = it.d + '/' + it.n;
    BY[it.key] = it;
    if (POOL[it.d]) POOL[it.d].push(it);
  }
  POOL.visual.sort(function (a, b) { return idxOf(a.n) - idxOf(b.n); });
  POOL.color.sort(function (a, b) { return idxOf(a.n) - idxOf(b.n); });

  /* 日期表：[月-日, 皮肤键, 类型] */
  var FIXED = [
    ['01-01', 'holiday/09 元旦', 'festival'],
    ['02-14', 'holiday/10 情人节', 'festival'],
    ['03-17', 'holiday/11 圣帕特里克节', 'festival'],
    ['07-04', 'holiday/13 独立日', 'festival'],
    ['10-01', 'holiday/08 国庆', 'festival'],
    ['10-01', 'remember/01 开国大典 1949', 'memorial'],
    ['10-31', 'holiday/14 万圣节', 'festival'],
    ['12-25', 'holiday/16 圣诞节', 'festival']
  ];
  var Y2026 = [
    ['02-17', 'holiday/01 春节', 'festival'],
    ['03-03', 'holiday/02 元宵', 'festival'],
    ['04-05', 'holiday/03 清明', 'festival'],
    ['04-05', 'holiday/12 复活节', 'festival'],
    ['06-19', 'holiday/04 端午', 'festival'],
    ['08-19', 'holiday/05 七夕', 'festival'],
    ['09-25', 'holiday/06 中秋', 'festival'],
    ['10-18', 'holiday/07 重阳', 'festival'],
    ['11-26', 'holiday/15 感恩节', 'festival']
  ];
  var SEASON = [
    ['03-01', 'season/01 春', 'season'],
    ['06-01', 'season/02 夏', 'season'],
    ['09-01', 'season/03 秋', 'season'],
    ['12-01', 'season/04 冬', 'season']
  ];
  var MEM = [
    ['01-26', 'remember/29 科比 2020', 'memorial'],
    ['01-28', 'remember/17 挑战者号 1986', 'memorial'],
    ['03-11', 'remember/24 日本311大地震 2011', 'memorial'],
    ['03-14', 'remember/27 霍金 2018', 'memorial'],
    ['04-04', 'remember/12 抗击新冠疫情 2020', 'memorial'],
    ['04-15', 'remember/13 泰坦尼克号 1912', 'memorial'],
    ['04-15', 'remember/28 巴黎圣母院火灾 2019', 'memorial'],
    ['04-24', 'remember/02 东方红一号 1970', 'memorial'],
    ['04-26', 'remember/18 切尔诺贝利 1986', 'memorial'],
    ['05-12', 'remember/07 汶川大地震 2008', 'memorial'],
    ['05-22', 'remember/11 袁隆平 2021', 'memorial'],
    ['06-06', 'remember/14 诺曼底登陆 1944', 'memorial'],
    ['07-01', 'remember/04 香港回归 1997', 'memorial'],
    ['07-20', 'remember/16 阿波罗11号 1969', 'memorial'],
    ['07-28', 'remember/03 唐山大地震 1976', 'memorial'],
    ['08-08', 'remember/08 北京奥运会 2008', 'memorial'],
    ['08-28', 'remember/15 马丁·路德·金 1963', 'memorial'],
    ['08-31', 'remember/20 戴安娜王妃 1997', 'memorial'],
    ['09-11', 'remember/21 911事件 2001', 'memorial'],
    ['10-05', 'remember/23 乔布斯 2011', 'memorial'],
    ['10-15', 'remember/06 神舟五号 2003', 'memorial'],
    ['10-16', 'remember/10 第一颗原子弹 1964', 'memorial'],
    ['11-09', 'remember/19 柏林墙倒塌 1989', 'memorial'],
    ['11-13', 'remember/26 巴黎恐袭 2015', 'memorial'],
    ['11-25', 'remember/30 马拉多纳 2020', 'memorial'],
    ['12-05', 'remember/25 曼德拉 2013', 'memorial'],
    ['12-13', 'remember/09 南京大屠杀 1937', 'memorial'],
    ['12-20', 'remember/05 澳门回归 1999', 'memorial'],
    ['12-26', 'remember/22 印度洋海啸 2004', 'memorial']
  ];

  var UNIQ = [], seen = {};
  FIXED.concat(Y2026, SEASON, MEM).forEach(function (e) {
    if (!BY[e[1]]) return;
    var sig = e[0] + '|' + e[1];
    if (seen[sig]) return;
    seen[sig] = 1;
    UNIQ.push(e);
  });

  /* ---------------- 工具 ---------------- */
  function pad2(n) { return n < 10 ? '0' + n : '' + n; }
  function mdOf(d) { return pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
  function ymdOf(d) { return d.getFullYear() + '-' + mdOf(d); }
  function doy(d) {
    var a = new Date(d.getFullYear(), 0, 1);
    var b = new Date(d.getFullYear(), d.getMonth(), d.getDate());
    return Math.round((b - a) / 86400000) + 1;
  }
  function hash(s) {
    var h = 2166136261;
    for (var i = 0; i < s.length; i++) {
      h ^= s.charCodeAt(i);
      h = (h + (h << 1) + (h << 4) + (h << 7) + (h << 8) + (h << 24)) >>> 0;
    }
    return h >>> 0;
  }
  function hexOf(item) {
    if (!item) return '#0B0D0F';
    var m = /#([0-9A-Fa-f]{6})/.exec(item.disp);
    return m ? '#' + m[1] : '#0B0D0F';
  }
  /* 当天事件：非季节事件优先；同日多个按 年+序日 轮换 */
  function plan(d) {
    var md = mdOf(d), evs = [];
    for (var i = 0; i < UNIQ.length; i++) if (UNIQ[i][0] === md) evs.push(UNIQ[i]);
    if (evs.length) {
      var use = [], seas = [];
      for (var j = 0; j < evs.length; j++) {
        if (evs[j][2] === 'season') seas.push(evs[j]); else use.push(evs[j]);
      }
      if (!use.length) use = seas;
      var pick = use[(doy(d) + d.getFullYear()) % use.length];
      return { mode: 'day', key: pick[1] };
    }
    var slot = Math.floor(d.getHours() / 8);
    return { mode: 'random', seed: ymdOf(d) + '#' + slot };
  }
  function randomPair(seed) {
    var v = POOL.visual.length ? POOL.visual[hash(seed + '|visual') % POOL.visual.length] : null;
    var c = POOL.color.length ? POOL.color[hash(seed + '|color') % POOL.color.length] : null;
    return { visual: v, color: c };
  }

  /* ---------------- 绘制 ---------------- */
  var wrap = document.getElementById('wrap');
  var fr = document.getElementById('skin');
  var lastSig = '', lastHtml = null, emptyWritten = false;

  function frameWrite(html) {
    if (html === lastHtml) return;
    lastHtml = html;
    try {
      var doc = fr.contentWindow.document;
      doc.open();
      doc.write(html || '<!DOCTYPE html><html><body style="margin:0;background:#0B0D0F"></body></html>');
      doc.close();
    } catch (e) {}
  }

  function render() {
    var now = new Date();
    var p = plan(now);
    var bg = '#0B0D0F', op = '1', html = '';
    if (p.mode === 'day') {
      var it = BY[p.key];
      html = it ? it.html : '';
    } else {
      var pair = randomPair(p.seed);
      if (pair.color) bg = hexOf(pair.color);
      if (pair.visual) html = pair.visual.html;
      op = '0.68';
    }
    wrap.style.background = bg;
    if (fr.style.opacity !== op) fr.style.opacity = op;
    var sig = (p.mode === 'day' ? 'd|' + p.key : 'r|' + p.seed) + '|' + op;
    if (sig !== lastSig) { lastSig = sig; frameWrite(html); }
  }

  render();
  setInterval(render, 30000);
})();
</script>
